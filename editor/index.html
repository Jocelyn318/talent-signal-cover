<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talent Signal · 封面工作台</title><link rel="stylesheet" href="editor.css"></head>
<body>
<header><div class="brand"><span class="signal">TS</span><div><strong>Talent Signal</strong><span class="caption">封面工作台 · 未来复古</span></div></div><div class="top-actions"><span class="local">仅保存在本机</span><button id="import">打开项目</button><button id="save">保存项目</button></div></header>
<main><section class="studio"><div class="toolbar"><div class="segmented"><button id="full" class="active">9:16 全幅</button><button id="crop">3:4 裁切预览</button></div><label class="check"><input type="checkbox" id="safe" checked>安全区</label><div class="history"><button id="undo" title="撤销">↶ 撤销</button><button id="redo" title="重做">↷ 重做</button></div></div>
<div class="canvas-stage"><div id="canvas-wrap"><canvas id="preview" width="1080" height="1920" aria-label="封面预览，可点击选中文字层并拖动"></canvas><canvas id="overlay" width="1080" height="1920" aria-hidden="true"></canvas></div></div>
<div class="preview-footer"><span id="dimensions">1080 × 1920</span><span>点击文字选择 · 拖动调整位置</span></div>
</section><aside><div class="panel-heading"><span class="eyebrow">CONTENT & TYPE</span><h1>让内容，成为封面。</h1><p>文字独立编辑，背景随时替换。</p></div>
<div id="status" role="status" aria-live="polite">正在加载本地字体…</div>
<div id="downloads" aria-label="已准备好的下载文件"></div>
<div id="layer-tabs" class="tabs"><button data-layer="title" class="active">主标题</button><button data-layer="subtitle">副标题</button><button data-layer="series">栏目名</button></div>
<div class="layer-options"><label class="check"><input id="visible" type="checkbox">显示图层</label><label class="check" title="锁定仅防止 AI 更新，仍可人工修改"><input id="locked" type="checkbox">防 AI 覆盖</label></div>
<label class="field">文字内容<textarea id="text" rows="3" maxlength="2000"></textarea></label>
<div class="row"><label class="field">字号<input id="fontSize" type="number" min="12" max="300" step="1"></label><label class="field">行距倍数<input id="lineHeight" type="number" min="0.8" max="3" step="0.01"></label><label class="field">文字颜色<input id="color" type="color"></label></div>
<div class="row"><label class="field wide">强调词<input id="highlight" type="text" maxlength="200" placeholder="输入需要着色的原文"></label><label class="field">强调色<input id="highlightColor" type="color"></label></div>
<div class="row"><label class="field">横坐标 X<input id="x" type="number" min="-1080" max="2160"></label><label class="field">纵坐标 Y<input id="y" type="number" min="-1920" max="3840"></label><label class="field">文字框宽度<input id="width" type="number" min="40" max="2160"></label></div>
<div class="row"><label class="field">对齐<select id="align"><option value="left">左对齐</option><option value="center">居中</option><option value="right">右对齐</option></select></label><label class="field">字重<select id="fontWeight"><option value="400">常规</option><option value="700">粗体</option><option value="900">特粗</option></select></label></div>
<p class="hint">回车可手动断行。人工修改会自动锁定该层；锁定不影响人工编辑。</p>
<details open><summary>背景与裁切</summary><button id="background" class="wide-button">上传 / 替换背景图</button><div class="range-field"><label for="scale">背景缩放</label><input id="scale" type="range" min="1" max="5" step="0.01"><output id="scale-value"></output></div><div class="range-field"><label for="focusX">左右焦点</label><input id="focusX" type="range" min="0" max="1" step="0.01"></div><div class="range-field"><label for="focusY">上下焦点</label><input id="focusY" type="range" min="0" max="1" step="0.01"></div><p class="hint">替换背景保留全部文字。只接收本地 PNG、JPEG、WebP。</p></details>
<div id="warnings" class="warnings" role="status"></div><div class="exports"><button id="export-full" class="primary" disabled>导出 9:16 PNG</button><button id="export-crop" disabled>导出 3:4 PNG</button></div><p class="footnote">所有编辑和导出在本机进行 · 不上传任何内容</p>
</aside></main><input id="project-file" type="file" accept=".json,application/json" hidden><input id="background-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
<script src="fonts.js"></script><script src="seed.js"></script><script src="render-core.js"></script><script src="editor.js"></script>
</body></html>
